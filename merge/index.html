<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Merge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(92vw, 420px);
      display: grid;
      gap: 14px;
    }
    button {
      width: 100%;
      border: 1px solid #2b2b2b;
      border-radius: 12px;
      background: #191919;
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      padding: 18px 20px;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease, opacity .15s ease;
    }
    button:hover { background: #232323; }
    button:active { transform: scale(.99); }
    button:disabled { cursor: default; opacity: .65; }
    .project {
      display: grid;
      gap: 8px;
    }
    .commits {
      margin: 0;
      padding-left: 22px;
      color: #a8a8a8;
      font-size: 13px;
      line-height: 1.45;
    }
    .commits:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="project">
      <button type="button" data-project="imenu">Squash &amp; Merge iMenu</button>
      <ul class="commits" data-commits="imenu"></ul>
    </div>
    <div class="project">
      <button type="button" data-project="engravida">Squash &amp; Merge Engravida</button>
      <ul class="commits" data-commits="engravida"></ul>
    </div>
  </main>

  <script>
    const ACCESS_KEY = "ANKI_APP_ACCESS_UNTIL";
    let mergePassword = "";
    const refreshTimers = new Map();

    function hasValidAccess() {
      return Date.now() < Number(localStorage.getItem(ACCESS_KEY) || "0");
    }

    function grantAccessFor1Day() {
      localStorage.setItem(ACCESS_KEY, String(Date.now() + 24 * 60 * 60 * 1000));
    }

    async function getExistingPassword() {
      const response = await fetch("/msg/app.js", { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load password configuration.");
      const source = await response.text();
      const match = source.match(/const API_KEY = "([^"]+)"/);
      const expected = match?.[1]?.slice(-3);
      if (!expected) throw new Error("Could not read password configuration.");
      return expected;
    }

    async function requireExistingPassword() {
      const expected = await getExistingPassword();

      if (!hasValidAccess()) {
        const typed = prompt("Enter password:");
        if (typed === null) return null;
        if (typed.trim() !== expected) {
          alert("Wrong password.");
          return null;
        }
        grantAccessFor1Day();
      }

      return expected;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function scheduleRefresh(project) {
      clearTimeout(refreshTimers.get(project));
      refreshTimers.set(project, setTimeout(() => loadCommits(project), 3000));
    }

    async function loadCommits(project) {
      const list = document.querySelector(`[data-commits="${project}"]`);
      const button = document.querySelector(`[data-project="${project}"]`);
      if (!list || !button) return;

      const original = button.dataset.label || button.textContent;
      button.dataset.label = original;

      try {
        const response = await fetch("/api/merge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project, password: mergePassword, action: "status" })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "Could not load commits.");

        list.innerHTML = (data.commits || [])
          .map(name => `<li>${escapeHtml(name)}</li>`)
          .join("");

        if (data.synced) {
          button.textContent = "Already synced ✓";
          button.disabled = true;
          return;
        }

        if (data.validation?.failed) {
          button.textContent = "Validation failed";
          button.disabled = true;
          scheduleRefresh(project);
          return;
        }

        if (!data.validation?.ready) {
          button.textContent = "Validating...";
          button.disabled = true;
          scheduleRefresh(project);
          return;
        }

        button.textContent = original;
        button.disabled = false;
      } catch {
        list.innerHTML = "";
        button.textContent = original;
        button.disabled = false;
      }
    }

    async function merge(project, button) {
      button.disabled = true;
      button.textContent = "Merging...";

      try {
        const response = await fetch("/api/merge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project, password: mergePassword })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Merge failed.");
        }

        if (data.pending) {
          button.textContent = "Validating...";
          scheduleRefresh(project);
          return;
        }

        button.textContent = data.merged ? "Merged ✓" : "Already synced ✓";
        await loadCommits(project);
      } catch (error) {
        button.textContent = "Failed";
        alert(error?.message || String(error));
        setTimeout(() => loadCommits(project), 1200);
      }
    }

    (async () => {
      try {
        mergePassword = await requireExistingPassword();
        if (!mergePassword) return;

        document.body.style.display = "flex";

        document.querySelectorAll("[data-project]").forEach(button => {
          button.addEventListener("click", () => merge(button.dataset.project, button));
          loadCommits(button.dataset.project);
        });
      } catch (error) {
        alert(error?.message || String(error));
      }
    })();
  </script>
</body>
</html>
