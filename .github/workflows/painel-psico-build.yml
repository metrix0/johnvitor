name: Painel Psico build

on:
  push:
    branches: [main]
    paths:
      - "painel-psico-app/**"
      - ".github/workflows/painel-psico-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel-psico-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
