name: AstroVials product page backup (every 5 minutes)

on:
  push:
    paths:
      - ".github/workflows/astrovials-backup-v2.yml"
      - ".github/scripts/astrovials-backup.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astrovials-product-backup-v2
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Independently compare exact AstroVials product page HTML
        run: node .github/scripts/astrovials-backup.mjs
