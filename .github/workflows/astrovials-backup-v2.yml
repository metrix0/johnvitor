name: AstroVials product page backup (manual while false alarms are investigated)

# TEMPORARY: disable 5-minute schedule to stop false change notifications.
# Netlify's independent 1-minute product watcher remains active.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astrovials-product-backup-v2
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Independently compare exact AstroVials product page HTML
        run: node .github/scripts/astrovials-backup.mjs
