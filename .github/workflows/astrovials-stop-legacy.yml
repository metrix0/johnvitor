name: Cancel stale AstroVials backup runner
on:
  push:
    paths:
      - ".github/workflows/astrovials-stop-legacy.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel old running AstroVials backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${{ github.repository }}/actions/runs/38735291092/cancel"
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$url"
          echo "Cancellation request accepted."
