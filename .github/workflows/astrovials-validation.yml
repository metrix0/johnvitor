name: AstroVials watcher validation

on:
  push:
    paths:
      - ".github/workflows/astrovials-validation.yml"
      - ".github/scripts/astrovials-backup.mjs"
      - "netlify/functions/astrovials-stock.js"
      - "tests/astrovials-stock.test.cjs"
      - "lib/astrovials-page-fetch.js"
      - "lib/astrovials-page-fingerprint.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate Netlify and backup watcher syntax
        run: |
          node --check netlify/functions/astrovials-stock.js
          node --check .github/scripts/astrovials-backup.mjs
          node --check lib/astrovials-page-fetch.js

      - name: Simulate Sold out to BANANA and validate alarm retries
        run: node --test tests/astrovials-stock.test.cjs

      - name: Publish a clearly labeled one-time end-to-end test alarm
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run-BANANA-simulation')
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: text/plain; charset=utf-8" \
            --header "Title: ALARM TRIGGER - AstroVials SIMULATION TEST" \
            --header "Priority: 5" \
            --header "Tags: warning,rotating_light" \
            --header "Click: https://astrovials.com/en/shop/estradiol-enanthate-mct" \
            --data "SIMULATION ONLY - not an actual website change. Before: Sold out. After: BANANA. Product: https://astrovials.com/en/shop/estradiol-enanthate-mct" \
            "https://ntfy.sh/astrovialseen"
