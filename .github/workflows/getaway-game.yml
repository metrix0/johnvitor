name: Getaway Club game validation
on:
  push:
    paths:
      - 'game2/**'
      - '.github/workflows/getaway-game.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game scripts
        run: |
          node --check --experimental-default-type=module game2/data.js
          node --check --experimental-default-type=module game2/simulation.js
          node --check --experimental-default-type=module game2/render.js
          node --check --experimental-default-type=module game2/main.js
      - name: Run campaign regression tests
        run: node --experimental-default-type=module --test game2/game.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Play solo campaign browser smoke
        run: node game2/browser.smoke.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getaway-solo-screenshot
          path: |
            /tmp/getaway-smoke.png
            /tmp/getaway-menu.png
          if-no-files-found: ignore
