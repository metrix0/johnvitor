name: Getaway Club game validation
on:
  push:
    paths:
      - 'game2/**'
      - '.github/workflows/getaway-game.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game scripts
        run: |
          node --check --experimental-default-type=module game2/data.js
          node --check --experimental-default-type=module game2/simulation.js
          node --check --experimental-default-type=module game2/render.js
          node --check --experimental-default-type=module game2/main.js
      - name: Run campaign regression tests
        run: node --experimental-default-type=module --test game2/game.test.mjs
