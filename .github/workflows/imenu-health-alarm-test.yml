name: iMenu health alarm test

on:
  push:
    paths:
      - ".github/imenu-health-alarm-test-trigger"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send iMenu alarm test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::error::NTFY_TOPIC repository secret is not configured."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 15             --request POST             --header "Title: ALARM TRIGGER - iMenu HEALTH CHECK TEST"             --header "Priority: 5"             --header "Tags: warning,rotating_light"             --header "Click: https://www.imenuapp.com.br"             --data-binary "TEST ONLY - iMenu health-check alarm path is working."             "https://ntfy.sh/$NTFY_TOPIC"
