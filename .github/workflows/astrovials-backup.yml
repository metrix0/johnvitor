name: AstroVials continuous backup watcher

on:
  push:
    paths:
      - ".github/workflows/astrovials-backup.yml"
      - ".github/scripts/astrovials-backup.mjs"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: astrovials-continuous-backup-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Check every five minutes
        shell: bash
        run: |
          set +e
          for i in $(seq 1 64); do
            echo "AstroVials check $i/64 at $(date -u +%FT%TZ)"
            node .github/scripts/astrovials-backup.mjs
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Check failed with exit $rc; continuing without alert."
            fi

            if [ "$i" -lt 64 ]; then
              sleep 300
            fi
          done

      - name: Start next watcher run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/astrovials-backup.yml/dispatches" \
            --data '{"ref":"main"}'
