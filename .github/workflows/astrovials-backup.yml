name: AstroVials legacy backup (retired)

# Retained only so any already-running legacy job can finish its dispatch
# into this harmless no-op instead of starting another long watcher.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy watcher retired. Use astrovials-backup-v2.yml instead."
