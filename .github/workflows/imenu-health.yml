name: iMenu health monitor

on:
  push:
    paths:
      - ".github/workflows/imenu-health.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: imenu-continuous-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check iMenu every five minutes
        shell: bash
        run: |
          set +e

          HEALTH_URL="https://www.imenuapp.com.br/api/health"
          BODY_FILE="${RUNNER_TEMP}/imenu-health-body.txt"

          check_health() {
            local status
            local last_failure=""

            : > "$BODY_FILE"
            status="$(curl --silent --show-error --location --max-time 15 --output "$BODY_FILE" --write-out "%{http_code}" "$HEALTH_URL")"
            rc=$?

            if [ "$rc" -ne 0 ]; then
              last_failure="network/timeout error"
            elif [ "$status" = "200" ] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$BODY_FILE"; then
              echo "iMenu health check passed at $(date -u +%FT%TZ)."
              return 0
            else
              last_failure="HTTP $status: $(head -c 300 "$BODY_FILE" | tr '\n' ' ')"
            fi

            echo "First health check failed: $last_failure"
            echo "Retrying in 30 seconds..."
            sleep 30

            : > "$BODY_FILE"
            status="$(curl --silent --show-error --location --max-time 15 --output "$BODY_FILE" --write-out "%{http_code}" "$HEALTH_URL")"
            rc=$?

            if [ "$rc" -eq 0 ] && [ "$status" = "200" ] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$BODY_FILE"; then
              echo "Retry succeeded; no alert sent."
              return 0
            fi

            if [ "$rc" -ne 0 ]; then
              last_failure="network/timeout error"
            else
              last_failure="HTTP $status: $(head -c 300 "$BODY_FILE" | tr '\n' ' ')"
            fi

            echo "Second health check failed: $last_failure"

            curl --fail --silent --show-error --max-time 15 \
              --request POST \
              "https://johnvitor.com/.netlify/functions/imenu-health-alarm"

            return 1
          }

          for i in $(seq 1 64); do
            echo "iMenu health cycle $i/64 at $(date -u +%FT%TZ)"
            check_health || true

            if [ "$i" -lt 64 ]; then
              sleep 300
            fi
          done

      - name: Start next health-monitor run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/imenu-health.yml/dispatches"             --data '{"ref":"main"}'
