<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ahgora</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(460px,calc(100% - 32px));text-align:center}.card{background:#171a21;border:1px solid #2a303b;border-radius:20px;padding:28px}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 24px;color:#9ca6b5;line-height:1.45}.btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#fff;color:#111;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;min-height:48px;padding:13px 14px;border-radius:12px;background:#101319;border:1px solid #292f39;color:#cfd6e2;text-align:left;font-size:14px;line-height:1.45}.ok{color:#b7f7c5}.err{color:#ffb7b7}.small{margin-top:14px;font-size:12px;color:#747f90}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Ahgora</h1>
      <p>Verifica o acesso e prepara uma sessão válida no Batida Online.</p>
      <button class="btn" id="run">Verificar Ahgora</button>
      <div class="status" id="status">Pronto.</div>
      <div class="small">Nenhum ponto é registrado por esta página.</div>
    </section>
  </main>
<script>
const button=document.getElementById('run');
const status=document.getElementById('status');

button.addEventListener('click',async()=>{
  button.disabled=true;
  status.className='status';
  status.textContent='Conectando ao Ahgora...';

  try{
    const res=await fetch('/api/ahgora',{method:'POST',headers:{Accept:'application/json'}});
    const data=await res.json();
    if(!res.ok||!data.ok) throw new Error(data.error||`HTTP ${res.status}`);

    status.className='status ok';
    status.textContent=`Tudo certo. ${data.employeeName||'Conta'} · matrícula ${data.enrollment} · ${data.rsa}. Nenhum ponto registrado.`;
  }catch(error){
    status.className='status err';
    status.textContent='Erro: '+error.message;
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
