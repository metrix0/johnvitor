<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ahgora</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:700px;margin:0 auto;padding:32px 18px 60px}h1{font-size:28px;margin:0 0 6px}p{color:#aeb6c4;margin:0 0 24px}.card{background:#171a21;border:1px solid #2a303b;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;color:#aeb6c4;margin-bottom:6px}input,textarea{width:100%;border:1px solid #343b47;background:#101319;color:#fff;border-radius:10px;padding:11px 12px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#fff;color:#111;text-decoration:none;display:inline-block}.btn.secondary{background:#282e39;color:#fff}.small{font-size:12px;color:#8d97a7;margin-top:8px}pre{white-space:pre-wrap;word-break:break-word;background:#0b0d11;border:1px solid #292f39;border-radius:10px;padding:13px;color:#dce3ef}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Ahgora</h1>
    <p>Helper manual para capturar e conferir o request do Batida Online.</p>

    <section class="card">
      <div class="grid">
        <div><label>account</label><input id="account" value="96"></div>
        <div><label>identity</label><input id="identity" value="6c41cd1f9f6a06d7d77f203b598f0339"></div>
        <div class="full"><label>Request URL</label><input id="url" placeholder="Cole a URL do request que retornou NSR 68098"></div>
        <div class="full"><label>password criptografada capturada</label><textarea id="password" placeholder="Cole aqui o ciphertext capturado. Nada é salvo."></textarea></div>
      </div>
      <div class="small">origin=pw2 · app_version=2.0 · key vazio · enc=true</div>
    </section>

    <section class="card">
      <div class="row">
        <a class="btn" href="https://app.ahgora.com.br/novabatidaonline/?defaultDevice=a518216" target="_blank" rel="noopener">Abrir Batida Online oficial</a>
        <button class="btn secondary" id="prepare">Conferir payload</button>
      </div>
    </section>

    <section class="card">
      <label>Payload preparado</label>
      <pre id="out">Preencha a Request URL e clique em Conferir payload.</pre>
    </section>
  </main>
<script>
const $=id=>document.getElementById(id);
$('prepare').addEventListener('click',()=>{
  const data={
    url:$('url').value.trim(),
    method:'POST',
    contentType:'application/x-www-form-urlencoded',
    fields:{
      account:$('account').value.trim(),
      password:$('password').value.trim()?'[ciphertext preenchido]':'[faltando]',
      identity:$('identity').value.trim(),
      origin:'pw2',
      app_version:'2.0',
      key:'',
      enc:'true'
    }
  };
  $('out').textContent=JSON.stringify(data,null,2);
});
</script>
</body>
</html>
