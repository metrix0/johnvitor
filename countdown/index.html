<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#fff9fc">
<title>Rinoplastia · Countdown</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#503c4d;background:#fff9fc;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:0}
body{padding:8px;overflow-x:hidden}
.card{position:relative;width:100%;margin:auto;background:#fff;border:1px solid #eee4ee;box-shadow:0 6px 24px #b39caa12;border-radius:17px;padding:19px 22px 17px}
.refresh-button{position:absolute;bottom:7px;right:7px;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:transparent;color:#aa98a6;cursor:pointer}
.refresh-button:hover{background:#faf2f7;color:#8e6587}
.refresh-button:focus-visible{outline:2px solid #9c6d95;outline-offset:1px}
.refresh-button:disabled{opacity:.65;cursor:default}
.refresh-button svg{width:13px;height:13px}
.refresh-button.is-loading svg{animation:refresh-spin 1s linear infinite}
@keyframes refresh-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh-button.is-loading svg{animation:none}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:25px;align-items:center}
.countdown{border-right:1px solid #eee7ed;padding-right:22px;min-width:0}
.label{font-size:12px;color:#9a8997;line-height:1.3}
h1{font-size:12px;font-weight:570;margin:0 0 7px;color:#8c7d88}
.clock{font-size:clamp(18px,3.1vw,28px);letter-spacing:-.055em;font-weight:760;color:#563b50;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.date-label{font-size:10.5px;margin-top:7px;color:#ae9eaa}
.finances{min-width:0}
.amount-main{font-size:clamp(27px,4.8vw,39px);font-weight:790;letter-spacing:-.06em;color:#ad6b91;line-height:1.18;font-variant-numeric:tabular-nums;white-space:nowrap;margin:3px 0 11px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric-value{font-size:clamp(14px,2.5vw,18px);font-weight:720;letter-spacing:-.04em;line-height:1.22;white-space:nowrap;color:#5e4657;font-variant-numeric:tabular-nums;margin-top:3px}
.metric .label{font-size:10px}
.progress-track{height:6px;background:#f3e9f0;border-radius:9px;overflow:hidden;margin-top:13px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#b585af,#db91a6);border-radius:9px;transition:width .4s ease}
.message{font-size:11px;color:#8c7187;margin-top:8px;line-height:1.45}
.message:empty{display:none}
.error{color:#a74d6d}
.login{margin-top:11px;padding:12px;background:#faf4f8;border:1px solid #f1e4ed;border-radius:10px}
.login p{font-size:11px;color:#826b7d;margin:0 0 8px;line-height:1.35}
.login-controls{display:flex;gap:7px}
.login input{min-width:0;flex:1;padding:9px;border-radius:7px;border:1px solid #e2cfdc;background:#fff;font:inherit;font-size:12px}
.login button{background:#9c6d95;color:#fff;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px}
[hidden]{display:none!important}
@media (max-width:520px){
 .card{padding:15px 13px;border-radius:14px}
 .layout{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:11px}
 .countdown{padding-right:10px}
 .clock{font-size:clamp(17px,4.3vw,23px);white-space:normal}
 .amount-main{font-size:clamp(21px,5.5vw,30px)}
 .metrics{gap:5px}
 .metric-value{font-size:clamp(12px,3vw,15px)}
 .label,h1{font-size:10.5px}
 .date-label{font-size:9px}
 .metric .label{font-size:9px}
}
@media (max-width:335px){
 .layout{gap:8px}
 .clock{font-size:17px}
 .amount-main{font-size:20px}
 .metric-value{font-size:12px}
 .card{padding:12px 9px}
}
</style>
</head>
<body>
<main class="card" aria-label="Rinoplastia e investimentos">
  <button type="button" class="refresh-button" id="refresh-button" title="Atualizar investimentos no Pluggy" aria-label="Atualizar investimentos no Pluggy" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/></svg>
  </button>
  <div class="layout">
    <section class="countdown" aria-label="Contagem regressiva">
      <h1>Dias até a rinoplastia</h1>
      <div class="clock" id="clock" aria-live="polite">—</div>
      <div class="date-label" id="date-label">Aguardando configuração</div>
    </section>
    <section class="finances" aria-label="Investimentos e meta">
      <div class="label">Valor faltante</div>
      <div class="amount-main" id="remaining">R$ —</div>
      <div class="metrics">
        <div class="metric"><div class="label">Investimento atual</div><div class="metric-value" id="balance">R$ —</div></div>
        <div class="metric"><div class="label">Meta</div><div class="metric-value" id="goal">R$ —</div></div>
      </div>
      <div class="progress-track" role="progressbar" id="progress" aria-label="Progresso até a meta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
    </section>
  </div>
  <div class="message" id="message" aria-live="polite"></div>
  <form class="login" id="login-form">
    <p>Para visualizar, use seu link privado do Notion ou insira a chave de acesso.</p>
    <div class="login-controls"><input id="access" type="password" required autocomplete="off" spellcheck="false" placeholder="Chave de acesso" aria-label="Chave de acesso"><button type="submit">Abrir</button></div>
  </form>
</main>
<script>
(function(){
  "use strict";
  var api="/.netlify/functions/countdown";
  var keyName="rhinoplasty_countdown_access_session";
  var access="";
  var surgeryDate=null;
  var nf=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  var el=function(id){return document.getElementById(id)};
  var money=function(value){return Number.isFinite(value)?nf.format(value):"R$ —"};
  function getToday(){
    var parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var obj={};parts.forEach(function(part){obj[part.type]=part.value});
    return {y:+obj.year,m:+obj.month,d:+obj.day};
  }
  function parseYMD(value){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return null;
    var a=value.split("-").map(Number),d=new Date(Date.UTC(a[0],a[1]-1,a[2]));
    return d.getUTCFullYear()===a[0]&&d.getUTCMonth()===a[1]-1&&d.getUTCDate()===a[2]?{y:a[0],m:a[1],d:a[2]}:null;
  }
  function dayNumber(date){return Date.UTC(date.y,date.m-1,date.d)/86400000}
  function addMonths(start,count){
    var index=start.y*12+start.m-1+count,y=Math.floor(index/12),m=index%12+1;
    return {y:y,m:m,d:Math.min(start.d,new Date(Date.UTC(y,m,0)).getUTCDate())};
  }
  function renderClock(){
    var end=parseYMD(surgeryDate);
    if(!end){el("clock").textContent="—";el("date-label").textContent="Data não configurada";return}
    var today=getToday(),days=dayNumber(end)-dayNumber(today);
    if(days<0){el("clock").textContent="Data já passou";el("date-label").textContent="";return}
    if(days===0){el("clock").textContent="É hoje!";el("date-label").textContent="";return}
    var months=(end.y-today.y)*12+(end.m-today.m),anchor=addMonths(today,months);
    if(dayNumber(anchor)>dayNumber(end)){months--;anchor=addMonths(today,months)}
    var remainingDays=dayNumber(end)-dayNumber(anchor);
    var parts=[];
    if(months>0)parts.push(months+" "+(months===1?"mês":"meses"));
    if(remainingDays>0 || months===0)parts.push(remainingDays+" "+(remainingDays===1?"dia":"dias"));
    el("clock").textContent=parts.join(" e ");
    el("date-label").textContent=new Intl.DateTimeFormat("pt-BR",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(end.y,end.m-1,end.d)));
  }
  function message(text,isError){el("message").textContent=text||"";el("message").classList.toggle("error",!!isError)}
  function update(data){
    surgeryDate=data.surgeryDate||null;renderClock();
    var balance=data.balance,goal=data.goal;
    el("balance").textContent=money(balance);
    el("goal").textContent=money(goal);
    el("remaining").textContent=Number.isFinite(goal)&&Number.isFinite(balance)?money(Math.max(0,goal-balance)):"R$ —";
    var progress=Number.isFinite(goal)&&goal>0&&Number.isFinite(balance)?Math.max(0,Math.min(100,Math.max(balance,0)/goal*100)):0;
    el("progress-fill").style.width=progress+"%";
    el("progress").setAttribute("aria-valuenow",String(Math.round(progress)));
    if(data.bankState==="ok")message("");
    else if(data.bankState==="needs_setup")message("Configuração pendente: "+data.missing.join(", "));
    else if(data.bankState==="empty")message("Nenhum investimento ativo em reais disponível nesta conexão. Confira as permissões de investimentos do Meu Pluggy.");
    else message(data.message||"Não foi possível consultar os investimentos.",true);
  }
  async function load(){
    if(!access)return;
    message("Consultando investimentos...");
    try{
      var response=await fetch(api,{method:"GET",headers:{"Authorization":"Bearer "+access},cache:"no-store"});
      var data=await response.json().catch(function(){return {}});
      if(response.status===401){
        access="";
        try{sessionStorage.removeItem(keyName)}catch(_){}
        el("login-form").hidden=false;el("refresh-button").hidden=true;el("access").value="";
        message("Chave inválida. Confira o link privado.",true);
        return;
      }
      if(!response.ok)throw new Error(data.message||"Erro ao consultar investimentos.");
      el("login-form").hidden=true;el("refresh-button").hidden=false;update(data);
    }catch(error){message(error.message||"Sem conexão no momento.",true)}
  }
  var refreshing=false;
  var pluggyScriptPromise=null;
  function finishRefresh(){
    refreshing=false;
    var button=el("refresh-button");
    button.disabled=false;
    button.classList.remove("is-loading");
  }
  function loadPluggyConnect(){
    if(window.PluggyConnect)return Promise.resolve();
    if(!pluggyScriptPromise){
      pluggyScriptPromise=new Promise(function(resolve,reject){
        var script=document.createElement("script");
        script.src="https://cdn.pluggy.ai/pluggy-connect/v2.3.1/pluggy-connect.js";
        script.onload=function(){window.PluggyConnect?resolve():reject(new Error("Pluggy Connect indisponível."))};
        script.onerror=function(){reject(new Error("Não foi possível carregar o Pluggy Connect."))};
        document.head.appendChild(script);
      }).catch(function(error){pluggyScriptPromise=null;throw error});
    }
    return pluggyScriptPromise;
  }
  async function openPluggyConnect(result){
    await loadPluggyConnect();
    var done=false;
    function closeWithMessage(text,isError){
      if(done)return;
      done=true;
      message(text,isError);
      finishRefresh();
    }
    var widget=new window.PluggyConnect({
      connectToken:result.connectToken,
      updateItem:result.itemId,
      theme:"light",
      onSuccess:async function(){
        if(done)return;
        done=true;
        message("Conexão atualizada. Consultando investimentos...");
        try{await load()}finally{finishRefresh()}
      },
      onError:function(){
        closeWithMessage("Não foi possível concluir a sincronização. Confira a conexão no Meu Pluggy.",true);
      },
      onClose:function(){
        closeWithMessage("Atualização cancelada.",false);
      }
    });
    widget.init();
  }
  async function refreshPluggy(){
    if(!access||refreshing)return;
    refreshing=true;
    var button=el("refresh-button");
    button.disabled=true;
    button.classList.add("is-loading");
    message("Solicitando atualização ao banco...");
    var widgetOpened=false;
    try{
      var response=await fetch(api,{method:"POST",headers:{"Authorization":"Bearer "+access},cache:"no-store"});
      var result=await response.json().catch(function(){return {}});
      if(!response.ok)throw new Error(result.message||"Não foi possível iniciar a atualização.");
      if(result.refreshState==="connect_required"){
        message("Confirme a atualização na janela do Pluggy...");
        await openPluggyConnect(result);
        widgetOpened=true;
        return;
      }
      message("Sincronizando com o banco...");
      for(var attempt=0;attempt<24;attempt++){
        await new Promise(function(resolve){setTimeout(resolve,5000)});
        var statusResponse=await fetch(api+"?syncStatus=1",{method:"GET",headers:{"Authorization":"Bearer "+access},cache:"no-store"});
        var status=await statusResponse.json().catch(function(){return {}});
        if(!statusResponse.ok)throw new Error(status.message||"Erro ao verificar sincronização.");
        if(status.syncState==="completed"){await load();return}
        if(status.syncState==="error")throw new Error(status.message||"A sincronização não foi concluída.");
      }
      message("O banco ainda está sincronizando. Os dados serão atualizados na próxima consulta.");
    }catch(error){message(error.message||"Não foi possível atualizar os investimentos.",true)}
    finally{if(!widgetOpened)finishRefresh()}
  }
  el("refresh-button").addEventListener("click",refreshPluggy);
  el("login-form").addEventListener("submit",function(e){
    e.preventDefault();access=el("access").value.trim();
    try{sessionStorage.setItem(keyName,access)}catch(_){}
    load();
  });
  var embedKey="";
  try{embedKey=new URLSearchParams(location.hash.slice(1)).get("key")||""}catch(_){}
  try{access=embedKey||sessionStorage.getItem(keyName)||""}catch(_){access=embedKey}
  if(access){el("login-form").hidden=true;el("refresh-button").hidden=false;load()}
  renderClock();
  setInterval(renderClock,60000);
  setInterval(function(){if(access)load()},30*60*1000);
})();
</script>
</body>
</html>
