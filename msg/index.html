<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../anki/app.css">
    <style>
        .wrap.msg-wrap{max-width:1100px}
        .msg-list{margin-top:16px;display:grid;gap:14px}
        .msg-panel{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);overflow:hidden}
        .msg-label{padding:12px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.03);color:var(--muted)}
        .msg-panel textarea{width:100%;min-height:190px;resize:vertical;border:0;border-radius:0;background:rgba(17,19,26,.75);padding:14px;font-size:15px;line-height:1.5}
        .msg-panel textarea:focus{box-shadow:inset 0 0 0 1px rgba(124,92,255,.55)}
        .save-row{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    </style>
</head>
<body>
<div class="wrap msg-wrap">
    <div class="topbar">
        <div class="left">
            <strong style="font-size:16px">Messages</strong>
            <span class="badge" id="statusBadge">Not connected</span>
        </div>
        <div class="right">
            <span class="badge" id="saveStatus"></span>
            <button class="btn-ok" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        </div>
    </div>

    <div class="msg-list">
        <div class="msg-panel">
            <div class="msg-label">1</div>
            <textarea id="msg1" placeholder="Write here..."></textarea>
        </div>
        <div class="msg-panel">
            <div class="msg-label">2</div>
            <textarea id="msg2" placeholder="Write here..."></textarea>
        </div>
        <div class="msg-panel">
            <div class="msg-label">3</div>
            <textarea id="msg3" placeholder="Write here..."></textarea>
        </div>
        <div class="msg-panel">
            <div class="msg-label">4</div>
            <textarea id="msg4" placeholder="Write here..."></textarea>
        </div>
        <div class="msg-panel">
            <div class="msg-label">5</div>
            <textarea id="msg5" placeholder="Write here..."></textarea>
        </div>
    </div>

    <div class="save-row">
        <div class="hint"><strong>Ctrl + S</strong> saves all five fields.</div>
        <button class="btn-ok" id="saveBtnBottom"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
